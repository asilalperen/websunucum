{% extends "base.html" %}

{% block content %}
<div style="text-align: center; padding: 50px; background-color: var(--box-bg); border: 2px solid #ff4444; border-radius: 15px; box-shadow: 0 0 20px rgba(255, 68, 68, 0.6); margin-top: 40px;">
    <h1 style="color: #ff4444; font-size: 4em; margin-bottom: 10px; text-shadow: 2px 2px 5px black;">500</h1>
    <h2 style="color: var(--text-main); font-size: 2em; margin-bottom: 10px;">Sistem Çekirdeği Çöktü!</h2>
    <p style="font-size: 1.2em; color: #ccc;">Ama Rammus'un dediği gibi: <strong style="color: white; font-size: 1.5em; text-transform: uppercase;">"Tamam."</strong></p>
    
    <div style="margin: 30px auto; max-width: 250px; border-radius: 50%; border: 4px solid #ff4444; overflow: hidden; box-shadow: 0 0 25px rgba(255, 68, 68, 0.8);">
        <img src="{{ url_for('static', filename='images/500.gif') }}" alt="500 Hata Görseli" style="width: 100%; display: block; transform: scale(1.15);">
    </div>
    
    <p style="font-family: monospace; color: #55ff55; background-color: #111; padding: 15px; border-radius: 5px; display: inline-block; box-shadow: inset 0 0 10px black; margin-bottom: 30px;">
        > Siber güvenlik protokolleri devrede, anılar kurtarılıyor... [ OK ]
    </p>
    <br>
    
    <a href="{{ url_for('main.index') }}" style="display: inline-block; padding: 12px 25px; background-color: #333; color: white; border-radius: 5px; font-weight: bold; border: 1px solid #777; text-decoration: none; transition: 0.3s;">Sistemi Yeniden Başlat (Ana Ekran)</a>
</div>
{% endblock %}
